[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afm-analysis"
version = "0.1.0"
description = "Analysis tools for AFM chip-wafer surface data"
requires-python = ">=3.13"
dependencies = ["numpy>=2.1", "scikit-image>=0.24"]

[project.scripts]
afm-analysis = "afm_analysis.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
